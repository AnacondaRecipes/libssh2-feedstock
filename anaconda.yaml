anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: libssh2/libssh2
      use_max_tag: true
      include_regex: ^libssh2-\d+\.\d+\.\d+(?:[-._].*)?$
      strip_prefix: libssh2-
      exclude_regex: (?i)^(?=.*(?:(?<=\d)rc\d*|(?<=\d)dev\d+|(?:^|[-._])(?:alpha|beta|gamma|pre|preview)(?:\d+)?|[-._]rc\d+|(?:^|[-._])dev\d+|(?:\d+\.)+\d+[ab]\d*)).+$
      from_pattern: ^v?(\d+(?:\.\d+)*.*)$
      to_pattern: \1
